<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campeonato de Tenis</title>
  <meta name="description" content="Clasificación y resultados en directo del campeonato de tenis." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23d8e635'/><path d='M14 22 Q50 50 14 78 M86 22 Q50 50 86 78' stroke='%231c3a2e' stroke-width='5' fill='none'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=1.2" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- Cabecera fija: categorías siempre visibles -->
  <header class="topbar" id="top">
    <nav class="cat-tabs" id="cat-tabs" aria-label="Categorías"></nav>
  </header>

  <!-- AVISO (config / error) -->
  <div class="aviso" id="aviso" hidden></div>

  <!-- LISTAS -->
  <section class="section" id="listas-sec" hidden>
    <div class="section__head">
      <span class="section__kicker">Apuntados</span>
      <h2 class="section__title">Jugadores</h2>
    </div>
    <div id="listas"></div>
  </section>

  <!-- ORDEN DE JUEGO -->
  <section class="section" id="orden-sec" hidden>
    <div class="section__head">
      <span class="section__kicker">Orden de juego</span>
      <h2 class="section__title">Partidos</h2>
      <p class="section__sub" id="orden-resumen"></p>
    </div>
    <div class="rondas" id="orden"></div>
  </section>

  <!-- ELIMINATORIAS -->
  <section class="section" id="elim-sec" hidden>
    <div class="section__head">
      <span class="section__kicker">Fase final</span>
      <h2 class="section__title">Eliminatorias</h2>
      <p class="section__sub" id="elim-resumen"></p>
    </div>
    <div id="elim"></div>
  </section>

  <!-- CLASIFICACIÓN -->
  <section class="section" id="clasificacion-sec">
    <div class="section__head">
      <span class="section__kicker">Tabla</span>
      <h2 class="section__title">Clasificación</h2>
    </div>
    <div id="clasificacion"></div>
  </section>

  <!-- CRUCES -->
  <section class="section section--alt" id="cruces-sec">
    <div class="section__head">
      <span class="section__kicker">Todos contra todos</span>
      <h2 class="section__title">Cruces</h2>
    </div>
    <div class="cruces" id="cruces"></div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer__brand">Tenis <em>Live</em></div>
    <p>Clasificación y resultados en directo · datos desde Google Sheets</p>
    <a href="#top" class="footer__top">Volver arriba ↑</a>
    <small class="footer__ver">v1.2</small>
  </footer>

  <script src="config.js?v=1.2"></script>
  <script src="cruces.js?v=1.2"></script>
  <script src="app.js?v=1.2"></script>
</body>
</html>
